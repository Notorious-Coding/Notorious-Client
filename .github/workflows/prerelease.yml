# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PreRelease Workflow

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  
jobs:
  publish:
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for NuGet trusted publishing
    env: 
      CONFIGURATION: 'Release'
      DOTNET_VERSION: '10.0.x'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test NotoriousClient.Tests.Unit --no-build --verbosity normal
    - name: Pack
      run: dotnet pack -c ${{ env.CONFIGURATION }}  -o out --version-suffix "beta.${{ github.run_number }}"
    - name: NuGet login (OIDC -> temporary API key)
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not email
    - name: Push
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
